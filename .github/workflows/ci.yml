name: CI

on:
  push:
  pull_request:

jobs:
  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 launcher regression
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-DevStartup.ps1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: study_agent
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: study_agent_test_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U study_agent -d study_agent_test_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://study_agent:test_only@localhost:5432/study_agent_test_ci
      TEST_DATABASE_URL: postgresql+asyncpg://study_agent:test_only@localhost:5432/study_agent_test_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov=study_agent --cov-report=term-missing --cov-fail-under=80
      - run: python -m ruff check --no-cache .
      - run: python -m mypy --no-incremental study_agent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    env:
      API_ACCESS_TOKEN: ci_only_not_for_public_deployment_123456789
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.production.yaml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail http://localhost:58000/api/health/ready
      - run: docker compose down
        if: always()
